[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confpub"
version = "0.1.0"
description = "Agent-first CLI to publish Markdown to Confluence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer[all]>=0.9",
    "pydantic>=2.0",
    "orjson>=3.9",
    "markdown-it-py[linkify,plugins]>=3.0",
    "atlassian-python-api>=3.41",
    "keyring>=24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
confpub = "confpub.cli:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
