[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confpub-cli"
dynamic = ["version"]
description = "Agent-first CLI to publish Markdown to Confluence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thomas Klok Rohde", email = "rohde.thomas@gmail.com" },
]
keywords = ["confluence", "markdown", "cli", "documentation", "publishing", "atlassian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "orjson>=3.9",
    "markdown-it-py[linkify,plugins]>=3.0",
    "atlassian-python-api>=3.41",
    "keyring>=24.0",
    "pyyaml>=6.0",
    "markdownify>=0.14",
    "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/ThomasRohde/confpub-cli"
Repository = "https://github.com/ThomasRohde/confpub-cli.git"
Issues = "https://github.com/ThomasRohde/confpub-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hatch>=1.0",
]

[project.scripts]
confpub = "confpub.cli:run"
confpub-cli = "confpub.cli:run"

[tool.hatch.version]
path = "confpub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["confpub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
